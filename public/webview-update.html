<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Closet · Update WebView</title><style>body{margin:0;padding:48px 24px;font:16px/1.7 sans-serif;color:#222934;background:#fffaf9}main{max-width:480px;margin:auto}h1{font-size:24px}button,select{padding:12px 20px;border:1px solid #c9aab4;border-radius:12px;background:#fff;font:inherit}</style></head><body><main><label>Language / 语言 <select id="language" onchange="setLanguage(this.value)"><option value="en">English</option><option value="zh-CN">简体中文</option></select></label><h1 id="heading">Update Android System WebView</h1><p id="instructions">New Closet needs Android System WebView 124 or later. Update it in your device's app store, then reopen New Closet.</p><p id="details">Updating keeps your saved wardrobe intact. Once updated, you can view and edit your local data offline.</p><button id="retry" onclick="location.href='/'">Try again after updating</button></main><script>
var messages={en:['Update Android System WebView',"New Closet needs Android System WebView 124 or later. Update it in your device's app store, then reopen New Closet.",'Updating keeps your saved wardrobe intact. Once updated, you can view and edit your local data offline.','Try again after updating'], 'zh-CN':['请先更新系统 WebView','New Closet 需要 Android System WebView 124 或更新版本。请在系统应用商店更新，然后重新打开 New Closet。','更新不会删除已保存的衣橱。完成更新后，查看和编辑手机资料不需要网络。','更新后重试']};
function setLanguage(value){var locale=value==='zh-CN'?'zh-CN':'en';document.documentElement.lang=locale;document.getElementById('language').value=locale;['heading','instructions','details','retry'].forEach(function(id,index){document.getElementById(id).textContent=messages[locale][index];});document.title='New Closet · '+messages[locale][0];try{localStorage.setItem('closet_locale',locale);}catch(e){}}
try{setLanguage(localStorage.getItem('closet_locale'));}catch(e){}
</script></body></html>
